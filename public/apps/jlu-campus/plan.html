<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9f0f1">
<meta name="description" content="吉林大学前卫校区像素校园：技术方案、公开地图资源、完整建设任务与验收记录。">
<title>前卫校园建设计划</title>
<style>
:root{color-scheme:light;--paper:#f8faf8;--lake:#215f63;--lake-dark:#163e43;--ink:#233c43;--quiet:#577076;--line:#cbd8d8;--mist:#e9f0f1;--grass:#d9e6d3;--amber:#805c23;--gap:#a54137;--focus:#b36c16}*{box-sizing:border-box}html{scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:16px;line-height:1.75}a{color:var(--lake);text-underline-offset:4px}button,input,select{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button,a,input,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default}a.button,button.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 17px;border:1px solid var(--lake);border-radius:6px;background:var(--lake);color:white;text-decoration:none;font-weight:600}a.secondary{background:transparent;color:var(--lake)}.frame{max-width:1500px;margin:auto;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.rail{padding:36px 24px;background:var(--mist);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow:auto;display:flex;flex-direction:column}.back{font-size:14px;text-decoration:none;margin-bottom:30px}.identity{border-bottom:2px solid var(--lake);padding-bottom:18px;margin-bottom:20px}.identity strong{display:block;font-family:"Songti SC","STSong",serif;font-size:26px;color:var(--lake-dark);letter-spacing:1px}.identity span{display:block;font-size:14px;color:var(--quiet);margin-top:7px}.rail nav{display:grid;gap:5px}.rail nav a{padding:8px 10px;color:var(--ink);text-decoration:none;border-left:3px solid transparent;border-radius:0 4px 4px 0}.rail nav a:hover{background:#dce8e7;border-color:var(--lake)}.rail-note{margin-top:auto;padding-top:34px;font-size:14px;color:var(--quiet)}.rail-note strong{display:block;color:var(--ink);margin-bottom:6px}main{padding:42px clamp(24px,4vw,64px) 64px;min-width:0}.intro{padding:8px 0 32px;border-bottom:1px solid var(--line)}.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--quiet)}.status{font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid currentColor;border-radius:4px;padding:1px 8px;line-height:1.65;color:var(--quiet)}.status:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.status.verified{color:var(--lake)}.status.passed{color:#246c4b}.status.paused{color:var(--gap)}.status.building{color:var(--amber)}.status.implemented{color:#39736c}.status.testing{color:#6f5b8a}.status.tested{color:#3b6d79}.status.pending{color:#5c667b}.status.gap{color:var(--gap)}h1{font-family:"Songti SC","STSong",serif;font-weight:600;font-size:clamp(32px,4vw,48px);line-height:1.28;margin:18px 0;color:var(--lake-dark)}h2{font-size:25px;line-height:1.4;margin:0 0 18px;font-weight:650}h3{font-size:18px;margin:0 0 6px}p{margin:0 0 12px;max-width:73ch}.lead{font-size:18px;max-width:69ch}.intro-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.notice{margin-top:22px;padding:12px 16px;border-left:3px solid var(--amber);background:#f2eee5;color:#665231;font-size:14px}.section{padding-top:40px;scroll-margin-top:20px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-bottom:18px}.section-head h2{margin:0}.subtle{color:var(--quiet);font-size:14px}.scope-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}.scope-item{padding-left:16px;border-left:3px solid #98b8ac}.scope-item p{margin:0}.timeline{padding:0;list-style:none;counter-reset:stage}.timeline li{counter-increment:stage;position:relative;display:grid;grid-template-columns:36px 1fr;gap:14px;padding:0 0 26px}.timeline li:before{content:counter(stage);width:32px;height:32px;display:grid;place-items:center;background:var(--mist);border:1px solid #9bb7b5;border-radius:50%;color:var(--lake-dark);font-size:14px;z-index:1}.timeline li:after{content:"";position:absolute;left:16px;top:31px;bottom:0;width:1px;background:var(--line)}.timeline li:last-child:after{display:none}.stage-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}.stage-top h3{margin:0}.timeline p{margin:5px 0 0}.filters{padding:16px;background:var(--mist);border-radius:8px;margin-bottom:16px;display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:12px}.search-label{font-size:14px;display:block;color:var(--quiet)}input[type=search]{width:100%;margin-top:5px;min-height:44px;background:#fff;border:1px solid #9fb7b7;border-radius:5px;padding:9px 12px;color:var(--ink)}.filter-label{font-size:14px;display:block;color:var(--quiet)}select{margin-top:5px;display:block;min-height:44px;min-width:150px;border:1px solid #9fb7b7;border-radius:5px;padding:8px 30px 8px 10px;color:var(--ink);background:white}.result-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 12px;font-size:14px;color:var(--quiet)}.text-button{background:none;border:0;color:var(--lake);text-decoration:underline;min-height:36px;padding:0 4px;font-size:14px}.task-list{border-top:1px solid var(--line)}.task{border-bottom:1px solid var(--line);background:transparent}.task summary{cursor:pointer;list-style:none;padding:18px 4px;display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:12px}.task summary::-webkit-details-marker{display:none}.task summary:after{content:"＋";font-size:20px;color:var(--lake)}.task[open] summary:after{content:"−"}.task summary strong{display:block;font-size:18px;line-height:1.5}.task summary small{display:block;font-size:14px;color:var(--quiet);font-weight:400;margin-top:3px}.task-body{padding:0 4px 22px;max-width:80ch}.task-body dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px 16px;margin:0 0 14px}.task-body dt{font-size:14px;color:var(--quiet)}.task-body dd{margin:0}.task-body ul{padding-left:22px;margin:8px 0 14px}.task-body li{margin:6px 0}.evidence{padding:10px 14px;background:#edf3ee;border-radius:4px;font-size:14px}.evidence.empty{background:#f0f1f3;color:#5c667b}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px;margin:18px 0}table{width:100%;border-collapse:collapse;min-width:440px}th,td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:left}thead{background:var(--mist)}th{font-weight:600}tbody tr:last-child td{border-bottom:0}td:nth-child(n+2),th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}.downloads{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.data-notes{font-size:14px;color:var(--quiet);padding-left:20px}.data-notes li{margin-bottom:7px}.architecture{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}.architecture article{padding-top:14px;border-top:2px solid #9bb7b5}.architecture p{margin:0}.difference-list{border-top:1px solid var(--line)}.difference{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px}.difference h3{font-size:16px}.difference p{margin:0}.gap-list{padding-left:22px}.gap-list li{margin-bottom:10px}.sources{display:grid;gap:14px;padding:0;list-style:none}.sources a{font-weight:600}.sources p{font-size:14px;color:var(--quiet);margin:3px 0 0}.footer{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--quiet);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.empty-state{padding:32px 16px;background:var(--mist);border-radius:6px;text-align:center}.loading{padding:50px 0;color:var(--quiet)}[hidden]{display:none!important}@media(max-width:980px){.frame{grid-template-columns:210px minmax(0,1fr)}.rail{padding:28px 18px}.scope-grid,.architecture{grid-template-columns:1fr}.difference{grid-template-columns:105px minmax(0,1fr)}main{padding:30px 26px 50px}}@media(max-width:700px){.frame{display:block}.rail{position:relative;height:auto;padding:16px 20px;border-right:0;border-bottom:1px solid var(--line)}.back{margin-bottom:10px}.identity{margin-bottom:10px;padding-bottom:10px}.identity strong{font-size:23px}.identity span{display:none}.rail nav{display:flex;overflow:auto;gap:8px}.rail nav a{white-space:nowrap;padding:6px 8px;font-size:14px;border-left:0;border-bottom:2px solid transparent}.rail-note{display:none}main{padding:24px 20px 40px}.lead{font-size:16px}.filters{grid-template-columns:1fr}.filter-label{display:flex;gap:12px;align-items:center}select{flex:1;margin:0}.section{padding-top:32px}.section-head{align-items:flex-start;flex-direction:column;gap:5px}.task summary{gap:8px}.task summary strong{font-size:16px}.task summary .status{font-size:14px}.task-body dl{grid-template-columns:1fr;gap:2px}.task-body dd{margin-bottom:8px}.difference{grid-template-columns:1fr;gap:3px}.intro-actions .button{flex:1}.footer{display:block}.footer a{display:inline-block;margin-top:8px}}@media print{.rail,.filters,.intro-actions,.downloads,.text-button{display:none}.frame{display:block}main{padding:0}.task-body{display:block}.task{break-inside:avoid}.section{padding-top:22px}body{font-size:11pt;background:white}}
</style>
</head>
<body>
<div class="frame">
<aside class="rail">
<a class="back" href="/">返回工作空间</a>
<div class="identity"><strong>前卫校园</strong><span>建设计划与验收档案</span></div>
<nav aria-label="计划章节"><a href="#scope">建设范围</a><a href="#stages">实施顺序</a><a href="#tasks">任务与验收</a><a href="#data">地图资源</a><a href="#architecture">技术方案</a><a href="#differences">差异与缺口</a><a href="#verification">检查记录</a><a href="#sources">来源记录</a></nav>
<div class="rail-note"><strong>完整体验，逐项核验</strong>同一份计划记录目标、实际证据和未完成项。发布状态与功能验收分别记录。</div>
</aside>
<main id="content"><p class="loading" role="status">正在读取校园建设计划…</p></main>
</div>
<script type="module">
const content=document.getElementById('content');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=value=>{try{const u=new URL(value,location.href);return ['https:','http:'].includes(u.protocol)?u.href:'#';}catch{return '#';}};
let plan;let query='';let status='all';
function badge(value){return `<span class="status ${esc(value)}">${esc(plan.statusLabels[value]||value)}</span>`;}
function section(id,title,body,aside=''){return `<section class="section" id="${id}"><div class="section-head"><h2>${title}</h2>${aside?`<span class="subtle">${aside}</span>`:''}</div>${body}</section>`;}
function task(item){return `<details class="task" id="${esc(item.id)}"><summary><span><strong>${esc(item.title)}</strong><small>${esc(item.id)} · ${esc(item.area)}</small></span>${badge(item.status)}</summary><div class="task-body"><dl><dt>参考站</dt><dd>${esc(item.reference)}</dd><dt>本次目标</dt><dd>${esc(item.target)}</dd></dl><strong>验收条件</strong><ul>${item.acceptance.map(text=>`<li>${esc(text)}</li>`).join('')}</ul><div class="evidence ${item.evidence.length?'':'empty'}">${item.evidence.length?`已有证据：${item.evidence.map(esc).join('；')}`:'尚未登记通过证据，不能据此认定功能已完成。'}</div></div></details>`;}
function renderTasks(){const value=query.trim().toLocaleLowerCase();const rows=plan.tasks.filter(item=>(status==='all'||item.status===status)&&(!value||JSON.stringify(item).toLocaleLowerCase().includes(value)));document.getElementById('task-list').innerHTML=rows.length?rows.map(task).join(''):'<div class="empty-state">没有符合条件的任务。可以换个关键词，或查看全部状态。</div>';document.getElementById('result-count').textContent=`显示 ${rows.length} / ${plan.tasks.length} 项`;document.getElementById('clear-filter').hidden=!query&&status==='all';const url=new URL(location.href);query?url.searchParams.set('q',query):url.searchParams.delete('q');status!=='all'?url.searchParams.set('status',status):url.searchParams.delete('status');history.replaceState(null,'',url);}
function render(){const complete=plan.tasks.filter(item=>item.status==='verified').length;content.innerHTML=`
<header class="intro"><div class="meta">${badge(plan.overallStatus)}<span>更新于 ${esc(plan.updatedAt)}</span></div><h1>${esc(plan.title)}</h1><p class="lead">${esc(plan.goal)}</p><div class="intro-actions"><a class="button" href="${cleanUrl(plan.gameUrl)}">进入校园</a><a class="button secondary" href="${cleanUrl(plan.workbenchUrl)}">研发协作工作台</a></div><p class="notice">${esc(plan.releaseStatement)}</p></header>
${section('scope','建设范围',`<div class="scope-grid">${plan.scope.map(item=>`<article class="scope-item"><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p></article>`).join('')}</div>`)}
${section('stages','先分析，再实施与验收',`<ol class="timeline">${plan.stages.map(stage=>`<li><div><div class="stage-top"><h3>${esc(stage.title)}</h3>${badge(stage.status)}</div><p>${esc(stage.gate)}</p></div></li>`).join('')}</ol>`)}
${section('tasks','任务与验收',`<div class="filters"><label class="search-label" for="task-search">搜索任务、目标或验收条件<input type="search" id="task-search" placeholder="例如：传送、北区、重连" autocomplete="off"></label><label class="filter-label" for="status-filter">任务状态<select id="status-filter"><option value="all">全部状态</option>${Object.entries(plan.statusLabels).map(([id,label])=>`<option value="${esc(id)}">${esc(label)}</option>`).join('')}</select></label></div><div class="result-line"><span id="result-count" aria-live="polite"></span><button type="button" class="text-button" id="clear-filter" hidden>清除筛选</button></div><div id="task-list" class="task-list"></div>`,`已核查 ${complete} 项 · 实测状态以展开后的证据范围为准`)}
${section('data','公开地图资源',`<p>${esc(plan.data.source)}，核查日期 ${esc(plan.data.checkedAt)}。南区校界约 ${esc(plan.data.south.size)}，北区校界约 ${esc(plan.data.north.size)}。</p><div class="table-wrap"><table><thead><tr><th scope="col">图层与质量</th><th scope="col">前卫南区</th><th scope="col">前卫北区</th></tr></thead><tbody>${plan.data.layers.map(row=>`<tr><td>${esc(row.name)}</td><td>${row.south}</td><td>${row.north}</td></tr>`).join('')}</tbody></table></div><div class="downloads"><a class="button secondary" href="${cleanUrl(plan.data.south.download)}" download>南区地图数据</a><a class="button secondary" href="${cleanUrl(plan.data.north.download)}" download>北区地图数据</a><a class="button secondary" href="./data/sources.json">来源清单</a></div><ul class="data-notes">${plan.data.notes.map(note=>`<li>${esc(note)}</li>`).join('')}</ul><p class="subtle">${esc(plan.data.projection)}</p><p class="subtle"><a href="${cleanUrl(plan.data.licenseUrl)}" target="_blank" rel="noopener noreferrer">${esc(plan.data.attribution)} · ${esc(plan.data.license)}</a></p>`)}
${section('architecture','技术方案',`<div class="architecture">${plan.architecture.map(item=>`<article><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p></article>`).join('')}</div>`)}
${section('differences','与参考站的差异和资料缺口',`<div class="difference-list">${plan.differences.map(item=>`<article class="difference"><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p></article>`).join('')}</div>${plan.officialReview?`<div class="notice"><strong>${esc(plan.officialReview.title)}</strong><p>${esc(plan.officialReview.summary)}</p><a href="${cleanUrl(plan.officialReview.url)}">查看已取得资料、缺口与申请范围</a></div>`:''}<ul class="gap-list">${plan.gaps.map(gap=>`<li>${esc(gap)}</li>`).join('')}</ul>`)}
${plan.verification?section('verification','检查记录',`<p>${esc(plan.verification.note)}</p><div class="architecture"><article><h3>${esc(plan.verification.localTitle)}</h3><p>${esc(plan.verification.localDetail)}</p></article><article><h3>${esc(plan.verification.onlineTitle)}</h3><p>${esc(plan.verification.onlineDetail)}</p></article></div><div class="downloads"><a class="button secondary" href="${cleanUrl(plan.verification.url)}">查看脱敏检查记录</a></div><p class="subtle">记录时间：${esc(plan.verification.checkedAt)}。记录与后续代码修改分别追踪，不能将旧测试自动视为新版本通过。</p>`):''}
${section('sources','来源记录',`<ul class="sources">${plan.sources.map(source=>`<li><a href="${cleanUrl(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)}</a><p>${esc(source.note)}</p></li>`).join('')}</ul>`)}
<footer class="footer"><span>项目计划、数据版本与验收证据随源码保留。</span><a href="./plan.json" download>下载完整计划 JSON</a></footer>`;
const url=new URL(location.href);query=url.searchParams.get('q')||'';status=url.searchParams.get('status')||'all';if(!(status in plan.statusLabels))status='all';const search=document.getElementById('task-search');const filter=document.getElementById('status-filter');search.value=query;filter.value=status;search.addEventListener('input',()=>{query=search.value;renderTasks()});filter.addEventListener('change',()=>{status=filter.value;renderTasks()});document.getElementById('clear-filter').addEventListener('click',()=>{query='';status='all';search.value='';filter.value='all';renderTasks();search.focus()});renderTasks();}
async function load(){try{const response=await fetch('./plan.json',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);plan=await response.json();if(!Array.isArray(plan.tasks)||!plan.statusLabels)throw Error('计划格式不完整');render();}catch(error){content.innerHTML=`<div class="empty-state"><h1>计划暂时未能打开</h1><p>请刷新重试。校园入口仍可使用。</p><div class="intro-actions"><button class="button" id="retry" type="button">重新读取</button><a class="button secondary" href="./index.html">进入校园</a></div><p class="subtle">${esc(error.message)}</p></div>`;document.getElementById('retry').addEventListener('click',load)}}
load();
</script>
</body>
</html>
