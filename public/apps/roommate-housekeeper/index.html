async function mutate(action,data={},reset=false){if(busy)return false;busy=true;document.querySelectorAll('button[data-do],dialog button[type=submit]').forEach(b=>b.disabled=true);try{const r=await fetch(reset?'/api/m/roommate-housekeeper/reset':'/api/m/roommate-housekeeper/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version,actor,action,data,requestId:crypto.randomUUID()})});const d=await r.json();if(d.state){state=d.state;version=d.version;}if(!r.ok){if(r.status===409&&!d.state){const retry=await fetch('/api/m/roommate-housekeeper/state');const fresh=await retry.json();if(fresh.state){state=fresh.state;version=fresh.version;}}throw Error(d.error||'保存失败，请重试');}render();toast(d.message);return true;}catch(e){if(state)render();const err=$('#form-error');if($('#modal').open&&err)err.textContent=e.message;else toast(e.message,true);return false;}finally{busy=false;document.querySelectorAll('button[data-do],dialog button[type=submit]').forEach(b=>b.disabled=false);}}
const navs=[['overview','grid','生活总览'],['bills','wallet','费用账本'],['chores','calendar','清洁排班'],['inventory','box','公共物品'],['rules','book','室友公约'],['cooperation','users','协作中心']];

/main></div>`;}
function heading(title,subtitle,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`;}
function stat(label,value,unit,footer,i,color=''){return `<div class="card stat"><div class="stat-head">${label}<span class="stat-icon ${color}">${icon(i)}</span></div><div class="stat-value">${value}<small>${unit}</small></div><div class="stat-footer">${footer}</div></div>`;}
function panelTop(title,sub='',link='',destination=''){return `<div class="section-top"><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div>${link?`<button class="text-btn" data-page="${destination}">${link}</button>`:''}</div>`;}
function empty(title,detail='',i='check'){return `<div class="empty">${icon(i)}<strong>${title}</strong>${detail}</div>`;}
function overview(){const b=core.balances(state)[actor],myTasks=state.tasks.filter(t=>t.assignee===actor&&t.status==='todo'&&t.date>=date),todayTasks=state.tasks.filter(t=>t.date===date),t=state.members.length;return `${productOverview()}${heading(`${name(actor)}，今天也要好好生活`,`${date.replaceAll('-',' / ')} · ${weekName(date)}，家里的大小事，都在这里。`,btn('记一笔费用','addBill',{},'','plus'))}<div class="stats">${stat(b>=0?'我的待收款':'我的待分摊',money(Math.abs(b)),'',b>=0?'账目清清楚楚，室友轻轻松松':'收款人确认后更新余额','wallet')}${stat('我的待办值日',myTasks.length,'项',`${openTasks().length?'另有 <b>'+openTasks().length+' 项</b>等待补位':'今日安排，井井有条'}`,'calendar','orange')}${stat('物品补货提醒',lowItems().length,'件',`${state.inventory.filter(i=>i.owner).length} 件已有人认领采购`,'box','green')}${stat('待确认公约',unread().length,'条',`${state.proposals.filter(p=>p.status==='voting').length} 项新提案正在讨论`,'book','pink')}</div><div class="layout"><div class="stack"><div class="welcome"><div><div class="tiny-tag">A LITTLE CARE, A BETTER HOME</div><h2>家务有分工，生活有照应。</h2><p>每一份小小的付出，都是让家变好的力量。</p></div><div class="house-symbol">${icon('home')}<div class="avatar-stack">${state.members.map(m=>avatar(m.id)).join('')}</div></div></div><section class="card">${panelTop('今天的家务','完成一件小事，留一份清爽给彼此','查看排班','chores')}${openTasks().length?`<div class="attention">${icon('heart')}<div class="grow"><strong>${name(openTasks()[0].original)}${openTasks()[0].reason==='病假'?'身体不适，安心休息中':'临时有事，需要搭把手'}</strong><p>${openTasks().length} 项值日等待自愿接班 · 生病不强制补值</p></div>${btn('看看能帮什么','goto',{page:'chores',filter:'open'},'secondary sm')}</div>`:''}${todayTasks.length?todayTasks.map(t=>taskRow(t)).join(''):empty('今天没有家务安排','给自己留一点轻松的时间。')}</section><div class="overview-bottom"><section class="card">${panelTop('家里快用完了','','全部物品','inventory')}${lowItems().slice(0,3).map(i=>`<div class="inventory-mini"><div class="item-icon ${i.icon==='bag'?'orange':''}">${icon(i.icon)}</div><div class="grow"><strong>${esc(i.name)}</strong><p>剩余 ${i.quantity} ${esc(i.unit)} · ${i.owner?name(i.owner)+'采购中':'等待采购'}</p></div>${i.owner?tag('已认领','blue'):btn('我来买','claimPurchase',{id:i.id},'soft sm')}</div>`).join('')||empty('库存充足','用后顺手登记，提醒才准确。')}</section><section class="card mini-proposal">${panelTop('我们的小约定','','全部公约','rules')}${state.proposals.some(p=>p.status==='voting')?`<span class="tag purple">正在征求大家意见</span><h3 style="margin-top:14px">${esc(state.proposals.find(p=>p.status==='voting').title)}</h3><p>家的规则由大家一起定。说出你的想法，四人都同意后才更新公约。</p>${btn('参与讨论','goto',{page:'rules'},'soft sm','book')}`:`<h3>约定有共识，相处更轻松</h3><p>需要调整生活习惯时，先发起提案，听听每位室友的想法。</p>${btn('看看公约','goto',{page:'rules'},'soft sm')}`}</section></div></div><aside class="stack"><section class="card">${panelTop('住在一起的我们')}<div class="avatar-stack">${state.members.map(m=>avatar(m.id,true)).join('')}</div>${state.members.map(m=>{const leave=activeLeave(m.id);return `<div class="roommate-row">${avatar(m.id)}<div class="grow"><strong>${m.name}${m.id===actor?' <span class="muted tiny">（当前身份）</span>':''}</strong><p>${m.room}</p></div>${!core.activeOn(state,m.id,date)?tag(state.handovers?.some(h=>h.member===m.id&&h.status==='moved')?'已搬离':'交接中'):leave?tag(leave.type,leave.type==='病假'?'orange':'purple'):tag('在住','green')}</div>`}).join('')}<p class="roster-note">临时有事提前说，身体不适好好休息。</p></section><section class="card">${panelTop('家里的新鲜事')}${state.activity.slice(0,4).map(a=>`<div class="event">${avatar(a.actor)}<div><p><strong>${name(a.actor)}</strong> ${esc(a.text)}</p><time>${new Date(a.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'})}</time></div></div>`).join('')}</section></aside></div>`;}
function taskActions(t,compact=false){const extra=t.status==='todo'&&t.assignee===actor?btn('求助','product',{kind:'releaseTask',id:t.id},'secondary sm'):'';if(t.status==='done')return tag(t.coordinated||'已完成','green');if(t.status==='skipped')return tag('协商跳过');if(t.status==='open')return `${core.available(state,actor,t.date)&&t.date>=date?btn('我来接班','claimTask',{id:t.id},'soft sm','heart'):''}${btn('协调','coordinate',{id:t.id},'secondary sm')}`;if(t.assignee===actor)return `${t.date<=date?btn('完成','completeTask',{id:t.id},'soft sm','check'):''}${t.date>=date?btn('换班','swap',{id:t.id},'secondary sm','swap'):''}${extra}`;return tag('待完成');}

function chores(){const end=core.dayAfter(weekStart,6);let tasks=state.tasks.filter(t=>taskFilter==='open'?t.status==='open':taskFilter==='overdue'?t.status==='todo'&&t.date<date:t.date>=weekStart&&t.date<=end);if(taskFilter==='mine')tasks=tasks.filter(t=>t.assignee===actor);if(dayFilter&&taskFilter!=='open')tasks=tasks.filter(t=>t.date===dayFilter);tasks.sort((a,b)=>a.date.localeCompare(b.date));const workloads=state.members.map(m=>({id:m.id,done:state.tasks.filter(t=>t.assignee===m.id&&t.status==='done').reduce((n,t)=>n+t.points,0),planned:state.tasks.filter(t=>t.assignee===m.id&&t.status==='todo').reduce((n,t)=>n+t.points,0),help:state.tasks.filter(t=>t.assignee===m.id&&t.status==='done'&&t.helper).length}));const max=Math.max(...workloads.map(w=>w.done+w.planned),1);return `${heading('干净的家，一起照顾','按工作量均衡轮排；有事可换班，生病安心请假。',btn('我要请假','leave',{},'secondary','heart')+btn('新增值日','addTask',{},'','plus'))}<div class="layout"><div class="stack"><section class="card"><div class="date-controls"><h2>值日安排</h2><div class="week-nav">${btn('<span class="sr-only">上一周</span>','week',{offset:-7},'ghost icon-only','left')}<span>${short(weekStart)} — ${short(end)}</span>${btn('<span class="sr-only">下一周</span>','week',{offset:7},'ghost icon-only','chevron')}${btn('本周','week',{offset:0},'secondary sm')}</div></div><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=core.dayAfter(weekStart,i);const ts=state.tasks.filter(t=>t.date===d);return `<button class="day-cell ${d===date?'today':''} ${dayFilter===d?'active':''}" data-do="day" data-args='{"date":"${d}"}' aria-pressed="${dayFilter===d}" aria-label="筛选 ${fmt(d)}"><span>${weekName(d)}</span><strong>${Number(d.slice(-2))}</strong><div class="dots">${ts.slice(0,3).map(t=>`<span class="${t.status==='open'?'amber':''}"></span>`).join('')}</div></button>`}).join('')}</div><div class="section-top"><div class="tabs" aria-label="任务筛选">${[['all','全部安排'],['mine','我的值日'],['open','待补位 '+openTasks().length],['overdue','逾期待办']].map(([id,label])=>`<button class="${taskFilter===id?'active':''}" data-do="taskFilter" data-args='{"filter":"${id}"}'>${label}</button>`).join('')}</div>${dayFilter?btn('清除日期筛选','day',{date:''},'ghost sm'):''}</div>${tasks.map(t=>`<article class="schedule-task ${t.status}"><div class="date-label">${weekName(t.date)}<strong>${Number(t.date.slice(-2))}</strong></div><div class="grow"><div class="task-title">${esc(t.title)}${t.status==='open'?'<span class="badge-inline">'+tag(t.date<date?'待共同协调':'待补位','orange')+'</span>':''}</div><div class="task-meta"><span>${t.status==='open'?'原安排 '+name(t.original):name(t.assignee)+(t.helper?' · 自愿接班':'')}</span><span>${t.points} 份工作量</span>${t.previousDate?`<span>已从 ${short(t.previousDate)} 延期</span>`:''}${state.swaps.some(x=>x.status==='pending'&&[x.mine,x.other].includes(t.id))?tag('换班待确认','purple'):''}</div></div><div class="task-buttons">${taskActions(t)}</div></article>`).join('')||empty('这段时间没有安排','可以新增任务，或一键生成下一周的轮排。','calendar')}<div class="notice">${icon('info')} 轻任务 1 份、常规清洁 2 份、深度清洁 3 份。排班参考累计完成与待办工作量，并避开已请假的日期。</div><button class="panel-link" data-do="generateWeek">${icon('spark')}&nbsp; 为下一个空白周均衡排班</button></section>${swapsPanel()}${leaveTools()}</div><aside class="stack"><section class="card">${panelTop('公平一点，也体谅一点','每一份付出都会被看见')}${workloads.map(w=>`<div class="workload"><div class="line"><span>${avatar(w.id)}${name(w.id)}</span><small>完成 ${w.done} · 待办 ${w.planned}</small></div><div class="bar" role="img" aria-label="${name(w.id)}累计工作量 ${w.done+w.planned}份"><i style="width:${(w.done+w.planned)/max*100}%"></i></div><div class="tiny muted" style="margin-top:5px">${w.help?'已帮忙接班 '+w.help+' 次':'谢谢你一起维护这个家'}</div></div>`).join('')}<div class="care-note">帮忙完成的任务计入工作量，下轮可少排一些。<strong>病假不扣分、不强制补值</strong>，恢复后正常参与。</div></section><section class="card">${panelTop('请假记录')}${state.leaves.filter(l=>!l.cancelled&&l.end>=date).map(l=>`<div class="leave-row"><div class="line">${avatar(l.member)}<strong>${name(l.member)}</strong>${tag(l.type,'orange')}</div><p>${short(l.start)} — ${short(l.end)} · ${l.type==='病假'?'安心休息，无需补值':l.makeup?'愿意回来后自愿认领一次':'返家后正常参与排班'}</p></div>`).join('')||empty('大家都在家','','home')}</section></aside></div>`;}
function swapsPanel(){const swaps=state.swaps.filter(x=>x.status==='pending');if(!swaps.length)return '';return `<section class="card">${panelTop('换班协商','对方确认前，双方的原排班保持不变')}${swaps.map(x=>{const a=state.tasks.find(t=>t.id===x.mine),b=state.tasks.find(t=>t.id===x.other);return `<div class="swap-card"><h3>${name(x.from)} 想和 ${name(x.to)} 换一次班</h3><p>${short(a.date)} ${esc(a.title)} ⇄ ${short(b.date)} ${esc(b.title)}</p><div class="task-buttons">${actor===x.to?btn('同意换班','respondSwap',{id:x.id,decision:'accept'},'soft sm')+btn('暂不方便','respondSwap',{id:x.id,decision:'reject'},'secondary sm'):actor===x.from?btn('撤回申请','respondSwap',{id:x.id,decision:'cancel'},'secondary sm'):tag('等待 '+name(x.to)+' 确认','purple')}</div></div>`}).join('')}</section>`;}
function bills(){const bal=core.balances(state),b=bal[actor],settle=core.settlements(state),pending=state.payments.filter(p=>p.status==='pending'),billList=state.bills.filter(b=>billFilter==='all'||b.shares.some(p=>p.member===actor));return `${heading('每一笔，都清清楚楚','支持均分、比例与居住天数分摊；先核对账单，再确认收款。',btn('记一笔费用','addBill',{},'','plus'))}<div class="stats">${stat('公共开销合计',money(state.bills.reduce((n,b)=>n+b.cents,0)),'',`${state.bills.length} 笔已登记费用`,'wallet')}${stat('我垫付的费用',money(state.bills.filter(b=>b.payer===actor).reduce((n,b)=>n+b.cents,0)),'','垫付与个人分摊分开计算','users','green')}${stat('待确认转账',pending.length,'笔','对方确认后，才算结清','clock','orange')}${stat('待协商账单',state.bills.filter(b=>b.dispute).length,'笔','有疑问的费用先聊清楚','book','pink')}</div><div class="layout"><div class="stack"><section class="card"><div class="section-top"><h2>共同账本<span class="pending-count">${billList.length} 笔</span></h2><div class="tabs">${[['all','全部费用'],['mine','我参与的']].map(([id,label])=>`<button data-do="billFilter" data-args='{"filter":"${id}"}' class="${billFilter===id?'active':''}">${label}</button>`).join('')}</div></div>${state.bills.some(b=>b.dispute)?'<div class="dispute-banner">有账单正在协商，暂缓新增转账。确认一致后再结算。</div>':''}<div class="scroll-table"><table class="bill-table"><thead><tr><th>费用明细</th><th>金额</th><th>垫付人</th><th>我的分摊</th></tr></thead><tbody>${billList.map(b=>`<tr><td><details class="bill-details"><summary><div class="bill-description">${esc(b.title)} ${b.dispute?tag('待协商','orange'):''}</div><div class="bill-sub">${short(b.date)} · ${esc(b.category)} · ${b.mode==='equal'?'均分':b.mode==='ratio'?'按比例':'按天数'} · 展开明细</div></summary><div class="bill-info">${billTools(b)}${b.shares.map(p=>`${name(p.member)} ${money(p.cents)}${b.mode==='ratio'?'（'+p.weight+'%）':b.mode==='days'?'（'+p.weight+'天）':''}`).join('<br>')}${b.dispute?`<p style="margin-top:10px;color:#ae8551">${name(b.dispute.member)}：${esc(b.dispute.reason)}</p>`:''}<p style="margin-top:8px">按分计算，余分按小数余量分配，合计与账单一致。</p>${b.dispute?(b.dispute.member===actor?btn('我的疑问已解决','resolveBill',{id:b.id},'soft sm'):''):b.shares.some(p=>p.member===actor)?btn('对分摊有疑问','dispute',{id:b.id},'secondary sm'):''}</div></details></td><td class="money">${money(b.cents)}</td><td><span style="display:flex;align-items:center;gap:6px">${avatar(b.payer)}${name(b.payer)}</span></td><td class="money">${b.shares.some(p=>p.member===actor)?money(b.shares.find(p=>p.member===actor).cents):'未参与'}</td></tr>`).join('')}</tbody></table></div>${!billList.length?empty('还没有账单','从一笔小小的共同开销开始。','wallet'):''}</section>${correctionsPanel()}${pending.length?`<section class="card">${panelTop('转账待确认','这里只记录线下转账，不会实际扣款')}${pending.map(p=>`<div class="payment"><strong>${name(p.from)} 付给 ${name(p.to)} · ${money(p.cents)}</strong><p>${short(p.date)} 已标记转账 · 等待收款人确认</p><div class="task-buttons">${p.to===actor?btn('确认已收到','confirmPayment',{id:p.id},'soft sm','check')+btn('尚未收到，退回','cancelPayment',{id:p.id},'secondary sm'):p.from===actor?btn('撤回记录','cancelPayment',{id:p.id},'secondary sm'):tag('待 '+name(p.to)+' 确认','orange')}</div></div>`).join('')}</section>`:''}${state.payments.some(p=>p.status==='confirmed')?`<section class="card">${panelTop('已确认的收付款')}${state.payments.filter(p=>p.status==='confirmed').map(p=>`<div class="settlement"><div class="relation">${name(p.from)} ${icon('arrow')} ${name(p.to)}</div><strong class="money">${money(p.cents)}</strong>${tag('已确认','green')}</div>`).join('')}</section>`:''}</div><aside class="stack"><div class="balance-hero"><div class="label">${b>=0?'我还应收回':'我还需分摊'}</div><div class="amount">${money(Math.abs(b))}</div><p class="description">已合并室友间的应收应付，减少来回转账。<br>${b===0?'当前已结清，轻松。':'线下转账后请在这里登记。'}</p></div><section class="card">${panelTop('建议这样结算','核对无误后，线下转账并登记')}${settle.map(p=>`<div class="settlement"><div class="relation">${avatar(p.from)}${name(p.from)} ${icon('arrow')} ${name(p.to)}</div><span class="money">${money(p.cents)}</span>${p.from===actor&&!pending.some(x=>x.from===actor)&&!state.bills.some(b=>b.dispute)?btn(' function originalStockStatus(i){if(i.expiry&&i.expiry<date)return tag('已过期','red');if(i.quantity<=i.threshold)return tag('需补货','orange');if(i.expiry&&i.expiry<=core.dayAfter(date,3))return tag('临近到期','purple');return tag('库存充足','green');}
function originalInventory(){const near=state.inventory.filter(i=>i.expiry&&i.expiry<=core.dayAfter(date,3));const list=state.inventory.filter(i=>stockFilter==='all'||(stockFilter==='low'?i.quantity<=i.threshold:i.expiry&&i.expiry<=core.dayAfter(date,3)));return `${heading('共享物品，用完记一笔','低库存自动提醒，采购先认领，让公共物品不断档。',btn('登记新物品','addItem',{},'','plus'))}<div class="stats">${stat('共享物品',state.inventory.length,'种','日常消耗，都有记录','box')}${stat('需要补货',lowItems().length,'件','库存达到提醒线时出现','bell','orange')}${stat('正在采购',state.inventory.filter(i=>i.owner).length,'件','先认领，避免重复购买','bag','green')}${stat('临期与过期',near.length,'件','优先使用，减少浪费','clock','pink')}</div><div class="section-top"><div class="tabs">${[['all','全部物品'],['low','需要补货'],['near','临期与过期']].map(([id,label])=>`<button class="${stockFilter===id?'active':''}" data-do="stockFilter" data-args='{"filter":"${id}"}'>${label}</button>`).join('')}</div><span class="small muted">${list.length} 件物品</span></div><div class="stock-grid">${list.map((i,n)=>`<article class="card stock-card ${i.quantity<=i.threshold?'low':''}"><div class="stock-top"><div class="item-icon ${n%3===1?'green':n%3===0?'orange':''}">${icon(i.icon)}</div>${stockStatus(i)}</div><h3>${esc(i.name)}</h3><p class="category">${esc(i.category)}</p><div class="stock-value">${i.quantity}<small>${esc(i.unit)}剩余</small></div><div class="bar" role="img" aria-label="剩余 ${i.quantity}${esc(i.unit)}，补货线 ${i.threshold}${esc(i.unit)}"><i style="width:${Math.min(100,i.quantity/(Math.max(i.threshold,1)*3)*100)}%"></i></div><div class="stock-threshold">补货提醒线 ≤ ${i.threshold} ${esc(i.unit)}${i.expiry?'<br>有效期至 '+fmt(i.expiry):''}</div><div class="stock-footer">${i.quantity>0?btn('登记消耗','consume',{id:i.id},'secondary sm'):''}${i.owner===actor?btn('补货完成','restock',{id:i.id},'soft sm'):!i.owner?btn('我来采购','claimPurchase',{id:i.id},'soft sm'):tag(name(i.owner)+'采购中','blue')}</div>${i.owner?`<div class="stock-owner">${name(i.owner)} 已认领 · ${i.owner===actor?'<button class="text-btn" data-do="cancelPurchase" data-args="'+esc(JSON.stringify({id:i.id}))+'">取消认领</button>':'等待补货完成'}</div>`:''}</article>`).join('')}</div>${!list.length?`<section class="card">${empty('目前没有需要提醒的物品','日常用后记一笔，库存会自动更新。','box')}</section>`:''}<div class="notice">${icon('info')} 补货时可填写采购金额，自动生成四人均分账单。提醒显示在本站内，暂不发送短信或消息通知。</div>`;}
function originalRules(){return `${heading('舒服的边界，一起约定','全员同意才生效；有不同意见，先聊聊再决定。',btn('提出新想法','propose',{},'','plus'))}<div class="rules-grid"><div>${state.rules.map((r,i)=>`<article class="card rule"><div class="rule-head"><div class="rule-num">0${i+1}</div><div class="grow"><h3>${esc(r.title)}</h3><p class="small muted" style="font-size:12px;margin-top:3px">${esc(r.category)} · 现行第 ${r.version} 版</p></div>${tag('生效中','green')}</div><p class="rule-body">${esc(r.content)}</p><div class="rule-footer"><div class="read-state"><div class="avatar-stack">${r.read.map(id=>avatar(id)).join('')}</div>${r.read.length}/4 已读确认</div>${r.read.includes(actor)?tag('我已确认','blue'):btn('我已读并了解','readRule',{id:r.id},'soft sm','check')}</div>${r.history.length?`<details class="history"><summary>查看历史版本（${r.history.length}）</summary>${r.history.map(h=>`<p>第 ${h.version} 版 · ${short(h.date)}<br>${esc(h.content)}</p>`).join('')}</details>`:''}</article>`).join('')}</div><aside class="stack"><section class="card">${panelTop('正在讨论的提案','每位室友的意见，都很重要')}${state.proposals.filter(p=>p.status==='voting').map(p=>proposal(p)).join('')||empty('暂时没有待讨论的提案','新的想法，可以随时提出。','book')}<div class="care-note">每人一票，在讨论结束前可以改票。四人全部同意才更新正文；若有人不同意，现行公约继续生效，修改后可重新提案。</div></section>${state.proposals.some(p=>p.status!=='voting')?`<section class="card">${panelTop('往期协商')}${state.proposals.filter(p=>p.status!=='voting').map(p=>proposal(p)).join('')}</section>`:''}<section class="card"><div class="tiny-tag">OUR LITTLE AGREEMENT</div><h3>我们住在一起，<br>也学着好好相处。</h3><p class="rule-body" style="margin-top:12px;font-size:13px">公约是共同的约定。遇到临时困难，可以先说出来，让规则留一点温度。</p></section></aside></div>`;}

const field=(label,html,hint='')=>`<label class="field">${label}${html}${hint?`<small>${hint}</small>`:''}</label>`;

function modal(title,subtitle,body,submit='保存'){const d=$('#modal');d.innerHTML=`<div class="modal-head"><div class="grow"><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="modal-close" data-do="close" aria-label="关闭弹窗">${icon('close')}</button></div><form id="modal-form" class="modal-body">${body}<div id="form-error" class="form-error" role="alert"></div>${submit?`<div class="modal-actions">${btn('取消','close',{},'secondary')}<button type="submit" class="btn" id="modal-submit">${submit}</button></div>`:''}</form>`;d.showModal();}

function readBillForm(){const f=$('#modal-form'),fd=new FormData(f),people=fd.getAll('people'),mode=fd.get('mode');return {title:fd.get('title'),category:fd.get('category'),payer:fd.get('payer'),date:fd.get('date'),mode,cents:Math.round(Number(fd.get('amount'))*100),people,duplicateReason:fd.get('duplicateReason'),weights:mode==='equal'?[]:people.map(id=>Number(f.elements.namedItem('weight-'+id).value))};}
function updateBillPreview(){const d=readBillForm();const weightMode=d.mode!=='equal';document.querySelectorAll('.split-row input[type=number]').forEach(i=>{i.hidden=!weightMode;i.max=d.mode==='days'?'31':'100';i.min=d.mode==='days'?'1':'0.01';i.step=d.mode==='days'?'1':'0.01';i.disabled=!$('#modal-form input[value="'+i.name.slice(7)+'"][type=checkbox]').checked;});document.querySelectorAll('.weight-unit').forEach(e=>{e.hidden=!weightMode;e.textContent=d.mode==='days'?'天':'%';});state.members.forEach(m=>$('#split-'+m.id).textContent='—');try{if(!d.people.length)throw Error('请选择至少一位参与室友。');if(d.mode==='ratio'&&Math.abs(d.weights.reduce((a,b)=>a+b,0)-100)>.001)throw Error('当前比例合计 '+d.weights.reduce((a,b)=>a+b,0).toFixed(2)+'%，请调整为 100%。');if(!d.cents){$('#split-note').textContent=d.mode==='days'?'填写每位室友的实际居住天数，按比例分摊。':'填好总金额后，可实时查看每个人应分摊多少。';return;}const parts=core.splitAmount(d.cents,d.people,d.weights);parts.forEach(p=>$('#split-'+p.member).textContent=money(p.cents));$('#split-note').textContent=`${d.people.length} 人参与 · 合计 ${money(d.cents)}。尾差按小数余量分配，保证分摊合计准确。`;}catch(e){$('#split-note').textContent=e.message;}}
function updateLeavePreview(){const f=new FormData($('#modal-form')),type=f.get('type'),start=f.get('start'),end=f.get('end');$('#makeup-line').hidden=type==='病假';if(type==='病假')$('#makeup-line input').checked=false;const affected=state.tasks.filter(t=>t.assignee===actor&&t.date>=start&&t.date<=end&&!['done','skipped'].includes(t.status));$('#leave-preview').innerHTML=`<strong>预计影响 ${affected.length} 项值日</strong><br>${affected.length?affected.map(t=>`${short(t.date)} · ${esc(t.title)}`).join('<br>'):'这段时间没有安排给你的值日。'}<br>${type==='病假'?'安心休息，无需补值。':'请假结束后恢复正常排班。'}`;}

function proposal(p){const base=baseProposal(p);return base+`<div class="proposal-discuss"><span class="tiny muted">${p.status==='expired'?'已到期，未回复不视为同意':'确认截止：'+fmt(p.deadline)} · ${p.required.length} 位相关室友</span>${pbtn('说说我的想法','discussion',{id:p.id,type:'proposal'},'ghost sm')}</div>`;}
function rules(){return originalRules().replaceAll('四人全部同意','相关在住室友全部同意').replaceAll('全员同意才生效','相关室友全员同意才生效');}
function cooperation(){const pending=state.repairs.filter(r=>r.status!=='closed').length,overdue=state.tasks.filter(t=>t.status==='todo'&&t.date<date).length;return `${heading('有事一起商量，有人接着处理','报修有跟进，退租有交接；人搬走，账目和承诺都有去处。',pbtn('我要退租交接','planMoveOut',{},'secondary','home')+pbtn('报告一个问题','reportRepair',{},'','plus'))}<div class="stats">${stat('报修待处理',pending,'项','处理人和验收人分开','help')}${stat('逾期值日',overdue,'项','可补做、求助或协商延期','clock','orange')}${stat('交接进行中',state.handovers.filter(h=>h.status==='planned').length,'人','搬离日起停止新排班','home','green')}${stat('账单更正待确认',state.corrections.filter(c=>c.status==='voting').length,'项','旧账保留，差额确认后生效','wallet','pink')}</div><div class="section-top"><div class="tabs">${[['repairs','报修与跟进'],['handover','退租与交接'],['pending','待办协商']].map(([id,label])=>`<button class="${cooperationTab===id?'active':''}" data-do="product" data-args='{"kind":"cooperationTab","tab":"${id}"}'>${label}</button>`).join('')}</div></div>${cooperationTab==='repairs'?repairPanel():cooperationTab==='handover'?handoverPanel():pendingPanel()}`;}
function repairPanel(){return `<div class="repairs-grid">${state.repairs.map(r=>`<article class="card repair-card"><div class="section-top"><span class="tag ${r.status==='closed'?'green':r.urgency==='紧急'?'red':'orange'}">${{open:'待跟进',handling:'处理中',review:'待他人验收',closed:'验收通过'}[r.status]}</span>${tag(r.urgency)}</div><h2>${esc(r.title)}</h2><p class="small muted" style="margin-top:8px">${esc(r.area)} · ${name(r.reporter)} 报告 · ${short(r.date)}</p><p class="rule-body" style="margin-top:15px">${esc(r.description)}</p><div class="notice">跟进人：${r.owner?name(r.owner):'等待认领'}${r.result?'<br>处理结果：'+esc(r.result):''}${r.feedback?'<br>验收反馈：'+esc(r.feedback):''}</div><div class="action-wrap">${r.status==='open'?pbtn('我来跟进','repairAction',{id:r.id,mode:'claim'},'soft sm'):r.owner===actor&&r.status==='handling'?pbtn('登记维修完成','repairReady',{id:r.id},'soft sm')+pbtn('转交待跟进','repairAction',{id:r.id,mode:'release'}):r.status==='review'&&r.owner!==actor?pbtn('确认修好了','repairAction',{id:r.id,mode:'accept'},'soft sm')+pbtn('还没修好','repairReopen',{id:r.id}):''}${pbtn('沟通记录','discussion',{id:r.id,type:'repair'})}</div>${r.history.length?`<details class="history"><summary>处理记录（${r.history.length}）</summary>${r.history.map(h=>`<p>${fmt(h.date)} · ${name(h.actor)} · ${{claim:'认领跟进',release:'转交待跟进',ready:'提交完工',accept:'验收通过',reopen:'退回继续处理'}[h.mode]}${h.note?'：'+esc(h.note):''}</p>`).join('')}</details>`:''}</article>`).join('')||`<section class="card">${empty('暂时没有报修问题','水龙头漏水、灯泡故障或家电异常，都可以在这里登记。','home')}</section>`}</div><div class="notice">维修跟进不等于承担维修费。先沟通费用由房东、个人或哪些室友承担，确认后再在账本中选择参与人记账；验收不会自动生成 AA 费用。</div>`;}
const handoverLabels={keys:'钥匙与门禁已交接',room:'房间清洁与现场验收',meters:'水电表计读数已核对',property:'私人物品带走、公共物品交接'};
function handoverPanel(){const current=state.handovers.filter(h=>h.status!=='cancelled');return `<div class="stack">${current.map(h=>{const b=core.handoverBlockers(state,h),settled=!b.balance&&!b.pending&&!b.disputes&&!b.corrections;return `<section class="card"><div class="section-top"><div><h2>${name(h.member)} 的退租交接</h2><p class="small muted">搬离日 ${fmt(h.date)} · 当天起不再安排新值日</p></div>${tag(h.status==='moved'?(settled?'已搬离 · 账务已结清':'已搬离 · 账务待处理'):'交接中',settled&&h.status==='moved'?'green':'orange')}</div><p class="rule-body">${esc(h.note)}</p><div class="handover-checks">${Object.entries(handoverLabels).map(([key,label])=>`<label class="check-line"><input type="checkbox" data-handover="${h.id}" data-key="${key}" ${h.checks[key]?'checked':''} ${h.member!==actor?'disabled':''}>${label}</label>`).join('')}</div><div class="details-grid"><div><small>目前${b.balance>=0?'待收回':'还需付'}</small><strong>${money(Math.abs(b.balance))}</strong></div><div><small>尚未确认的账務</small>${b.pending} 笔转账 · ${b.disputes} 笔争议 · ${b.corrections} 笔更正</div></div><div class="notice">水电结算可使用账本的“按居住天数分摊”。押金与房东单独核对。搬离不自动豁免欠款，历史账单和收付款入口继续保留。</div><div class="action-wrap">${h.member===actor&&h.status==='planned'?pbtn('确认实物交接并搬离','finishMoveOut',{id:h.id},'soft sm')+pbtn('取消搬离计划','cancelMoveOut',{id:h.id}):''}${btn('处理账务','goto',{page:'bills'},'secondary sm')}</div></section>`}).join('')||`<section class="card">${empty('需要搬家时，先把交接列清楚','未来值日、采购和维修跟进会转回待协调；历史账款继续保留。','home')}${pbtn('建立我的交接单','planMoveOut',{},'soft')}</section>`}</div>`;}
function pendingPanel(){const tasks=state.tasks.filter(t=>t.status==='todo'&&t.date<date);return `<div class="stack"><section class="card">${panelTop('逾期值日，也要有去处','不自动罚款，不偷偷移除')}${tasks.length?tasks.map(t=>taskRow(t)).join(''):empty('没有逾期值日','谢谢大家按时维护这个家。')}${btn('查看请假和补位','goto',{page:'chores'},'secondary sm')}</section>${correctionsPanel()}${purchasePanel()}</div>`;}
const pfield=(label,html,hint='')=>field(label,html,hint);
function openProduct(kind,d={}){
 modalKind='p:'+kind;modalData=d;
 if(kind==='extendLeave'){const l=state.leaves.find(l=>l.id===d.id);modal('延长这次请假','只调整新增日期，不打乱已确认接班。',field('新的结束日期',input('end','date',core.dayAfter(l.end,1),`required min="${core.dayAfter(l.end,1)}" max="${core.dayAfter(date,31)}"`)),'确认延期');}
 else if(kind==='releaseTask'){modal('这次值日，需要搭把手','说明原因后开放自愿接班；无人接班时继续显示待协调。',field('求助原因',input('reason','text','','required maxlength="80" placeholder="例如：今天加班，无法按时回家"')),'发布求助');}
 else if(kind==='correctBill'){const b=state.bills.find(b=>b.id===d.id);modal('纠正金额，保留来龙去脉',esc(b.title)+' · 当前净金额 '+money(core.billTotal(state,b.id)),field('正确的总金额（元）',input('amount','number',(core.billTotal(state,b.id)/100).toFixed(2),'required min="0" max="1000000" step="0.01"'),'如为重复账单，可更正为 0 元，原记录仍保留。')+field('为什么需要更正？','<textarea name="reason" required maxlength="200" placeholder="例如：原票据多输入了一位数字。"></textarea>')+'<div class="notice">沿用原参与人与分摊比例。相关室友全部同意后，新增一条差额调整；原账单和已确认付款都不会被覆盖。</div>','发起金额更正');}
 else if(kind==='refundBill'){const b=state.bills.find(b=>b.id===d.id);modal('已经收到商家退款',esc(b.title)+' · 最多可退 '+money(core.billTotal(state,b.id)),field('本次收到退款（元）',input('amount','number','','required min="0.01" step="0.01" max="'+core.billTotal(state,b.id)/100+'"'))+field('退款原因',input('reason','text','','required maxlength="200" placeholder="例如：公共商品退货"'))+'<label class="check-line"><input type="checkbox" required>我确认已实际收到商家退款</label><div class="notice">退款按原费用的分摊关系返还，即使此前已结清，也会重新计算应退给室友的余额。不会直接删除原账单。</div>','登记退款');}
 else if(kind==='discussion'){showDiscussion(d);}
 else if(kind==='planPurchase'){const options=state.inventory.filter(i=>!state.purchasePlans.some(p=>p.item===i.id&&['voting','approved'].includes(p.status)));modal('先商量，再买回家','超过 200 元的公共采购必须先取得参与人同意。',options.length?field('采购物品',select('id',options.map(i=>[i.id,i.name]),d.id||''))+`<div class="form-row">${field('计划购入数量',input('quantity','number','1','required min="1" max="9999" step="1"'))}${field('预算上限（含运费，元）',input('amount','number','','required min="0.01" max="1000000" step="0.01"'))}</div>`+field('预计完成日',input('due','date',core.dayAfter(date,3),`required min="${date}"`))+field('购买理由',input('reason','text','','required maxlength="200" placeholder="例如：旧物品损坏，需要更换"'))+`<div class="small muted" style="margin-bottom:10px">参与分摊的室友</div>${state.members.filter(m=>core.activeOn(state,m.id,date)).map(m=>`<label class="check-line"><input name="people" type="checkbox" value="${m.id}" checked>${m.name}</label>`).join('')}`:empty('所有物品已有有效计划','可以先结束旧计划，或登记需要采购的新物品。'),options.length?'发起预算协商':false);}
 else if(kind==='extendPurchase'){const i=state.inventory.find(i=>i.id===d.id);modal('更新预计采购日',esc(i.name),field('预计完成日',input('due','date',core.dayAfter(date,1),`required min="${date}" max="${core.dayAfter(date,14)}"`)),'更新日期');}
 else if(kind==='discardStock'){const i=state.inventory.find(i=>i.id===d.id),b=i.batches.find(b=>b.id===d.batch);modal('登记丢弃或损耗',`${esc(i.name)} · 本批次 ${b.quantity} ${esc(i.unit)}`,field('已处理数量',input('quantity','number',b.quantity,`required min="1" max="${b.quantity}" step="1"`))+field('处理原因',select('reason',['已经过期','开封后变质','包装破损','其他损耗']))+'<label class="check-line"><input type="checkbox" required>已经实际丢弃或处理</label>','确认处理');}
 else if(kind==='consumeV2'){const i=state.inventory.find(i=>i.id===d.id),x=core.stockInfo(i);modal('登记一次使用',`${esc(i.name)} · 可用 ${x.usable} ${esc(i.unit)}`,field('使用数量',input('quantity','number','1',`required min="1" max="${x.usable}" step="1"`))+'<div class="notice">自动优先扣除临近到期的批次，过期库存不可登记使用。</div>','确认消耗');}
 else if(kind==='restockV2'){const i=state.inventory.find(i=>i.id===d.id),plans=state.purchasePlans.filter(p=>p.item===i.id&&p.status==='approved');modal('补货完成，一次记清',esc(i.name),`<div class="form-row">${field('实际购入数量',input('quantity','number',plans[0]?.quantity||1,'required min="1" max="9999" step="1"'))}${field('实际花费（元）',input('amount','number','0','required min="0" max="1000000" step="0.01"'))}</div>`+field('本批次有效期（选填）',input('expiry','date','',`min="${date}"`))+field('关联已通过的采购计划',select('plan',[['','无计划 · 日常小额采购'],...plans.map(p=>[p.id,`${p.title} · 预算 ${money(p.cents)}`])],plans[0]?.id||''))+'<div class="notice">超过 200 元或已有计划时，必须使用已通过的预算。实际金额不得超预算、数量不得改变；补货后自动记账，新旧保质期分别保留。</div>','完成补货并记账');}
 else if(kind==='reportRepair'){modal('发现问题，先登记下来','跟进人负责处理，另一位室友负责验收。',field('问题标题',input('title','text','','required maxlength="60" placeholder="例如：洗衣机排水时漏水"'))+`<div class="form-row">${field('位置',select('area',['厨房','客厅','卫生间','阳台','其他']))}${field('影响程度',select('urgency',['普通','影响生活','紧急']))}</div>`+field('具体情况','<textarea name="description" required maxlength="400" placeholder="描述现象、出现时间和当前影响，方便接手。"></textarea>')+'<div class="notice">紧急故障请先联系物业、房东或专业维修人员。本页面用于跟进记录，不会自动联系上门服务。</div>','提交报修');}
 else if(kind==='repairReady'||kind==='repairReopen'){modal(kind==='repairReady'?'登记维修结果':'反馈验收问题',kind==='repairReady'?'提交后由另一位室友验收。':'说明哪里还没解决，让跟进人继续处理。',field(kind==='repairReady'?'做了哪些处理？':'还有什么问题？','<textarea name="note" required maxlength="300"></textarea>'),kind==='repairReady'?'提交待验收':'退回继续处理');}
 else if(kind==='planMoveOut'){modal('搬家之前，把交接说清楚','搬离不代表账务自动结清。',field('计划搬离日期',input('date','date',core.dayAfter(date,7),`required min="${date}"`))+field('交接说明','<textarea name="note" maxlength="300" placeholder="例如：与房东核对押金，水电按实际居住天数结算。"></textarea>')+'<div class="notice">搬离当天及之后的未完成值日会开放补位，已认领采购及维修跟进将转回待处理。旧账、欠款和待收款继续保留，新费用不会默认分给已搬离室友。</div>','建立交接单');}
}
function showDiscussion(d){const collection={bill:state.bills,proposal:state.proposals,repair:state.repairs}[d.type],r=collection.find(x=>x.id===d.id),comments=state.comments.filter(c=>c.type===d.type&&c.target===d.id);modal('把想法说清楚',esc(r.title),`<div class="discussion-list">${comments.map(c=>`<div class="discussion-message">${avatar(c.actor)}<div class="grow"><strong>${name(c.actor)}</strong><p>${esc(c.text)}</p><small>${new Date(c.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<p class="small muted">还没有讨论。说明疑问、补充依据，或提出更合适的办法。</p>'}</div>`+field('我的想法','<textarea name="text" required maxlength="400" placeholder="友善、具体地说出你的建议。"></textarea>'),'发布到讨论记录');}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-do="product"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.disabled)return;const d=JSON.parse(b.dataset.args||'{}'),kind=d.kind;delete d.kind;
 if(kind==='cooperationTab'){cooperationTab=d.tab;render();return;}
 if(['changeLeave','voteCorrection','votePurchase','takePurchase','repairAction','cancelPlan','finishMoveOut','cancelMoveOut'].includes(kind)){await mutate(kind,d);return;}
 openProduct(kind,d);
},true);
document.addEventListener('change',async e=>{if(!e.target.matches('[data-handover]'))return;const b=e.target;b.disabled=true;await mutate('checkHandover',{id:b.dataset.handover,key:b.dataset.key,done:b.checked});},true);
document.addEventListener('submit',async e=>{
 if(e.target.id!=='modal-form'||!modalKind.startsWith('p:'))return;e.preventDefault();e.stopImmediatePropagation();if(busy)return;$('#form-error').textContent='';const fd=new FormData(e.target),kind=modalKind.slice(2),data={...modalData,...Object.fromEntries(fd)};let action=kind;
 if(['correctBill','refundBill','planPurchase','restockV2'].includes(kind))data.cents=Math.round(Number(data.amount)*100);
 if(['planPurchase','discardStock','consumeV2','restockV2'].includes(kind))data.quantity=Number(data.quantity);
 if(kind==='correctBill')action='requestCorrection';
 if(kind==='planPurchase')data.people=fd.getAll('people');
 if(kind==='extendLeave'){action='changeLeave';data.mode='extend';}
 if(kind==='discussion'){action='comment';data.type=modalData.type;}
 if(kind==='consumeV2')action='consume';
 if(kind==='restockV2')action='restock';
 if(kind==='repairReady'||kind==='repairReopen'){action='repairAction';data.mode=kind==='repairReady'?'ready':'reopen';}
 const ok=await mutate(action,data);if(ok)$('#modal').close();
},true);
function syncBillParticipants(){if(modalKind!=='addBill'||!$('#modal').open)return;const chosenDate=$('#modal-form [name=date]').value;document.querySelectorAll('#modal-form [name=people]').forEach(c=>{c.disabled=!core.activeOn(state,c.value,chosenDate);if(c.disabled)c.checked=false;});updateBillPreview();}
const modalObserver=new MutationObserver(()=>{if(modalKind==='addBill'&&$('#modal').open)syncBillParticipants();});
modalObserver.observe($('#modal'),{attributes:true,attributeFilter:['open']});
document.addEventListener('change',e=>{if(modalKind==='addBill'&&e.target.name==='date')syncBillParticipants();});

})();</script></body></html>
